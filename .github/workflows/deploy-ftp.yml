name: Deploy to Aruba FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

# Unico percorso verso la produzione: test → FTPS → controllo di salute.
# Le migrazioni del DB restano manuali (vedi CLAUDE.md).

concurrency:
  group: deploy-produzione
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ogni deploy cambia il ?v= di CSS e JS in index.html: il browser e il proxy di Aruba
      # non servono più la versione vecchia (prima andava aggiornato a mano).
      - name: Versione degli script
        run: sed -i -E "s/\?v=[0-9]+/?v=$(date +%s)/g" index.html && grep -c '?v=' index.html

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_PATH }}/
          # FTP esplicito su TLS: credenziali e file non viaggiano in chiaro.
          # Niente "security: strict": il certificato del server è per ftplnx02.aruba.it,
          # non per ftp.mv-consulting.it (hostname mismatch), e la verifica fallirebbe.
          protocol: ftps
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/dist/**
            **/.github/**
            **/.gemini/**
            **/tmp_pdf_parse/**
            **/tmp_venv/**
            **/PDF Pagamenti/**
            deploy
            deploy.py
            .env.deploy
            .env
            .env.example
            .DS_Store
            .gitignore
            test_*
            debug_*
            scratch_*
            fix_*
            reset_*
            setup_db*
            check_db*
            migrate_*
            list_tables*
            cleanup*
            db_dump*
            delete_token*
            _autodeploy.php
            deploy_update.php
            **/*.md
            .agents/**
            scripts/**
            tests/**
            cron/*.log
            deploy.config
            deploy_manifest.json
            .deploy_cache.json
            .deploy_history.log

      - name: Controllo di salute
        run: |
          sleep 5
          body=$(curl -sS --max-time 30 https://www.mv-consulting.it/ERP/api/health.php || true)
          echo "$body" | grep -Eq '"status": *"ok"' || { echo "::error::Health check non ok: $body"; exit 1; }
          echo "Produzione ok"
