name: Deploy to Aruba FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_PATH }}/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/dist/**
            **/.github/**
            **/.gemini/**
            **/tmp_pdf_parse/**
            **/tmp_venv/**
            **/PDF Pagamenti/**
            deploy
            deploy.py
            .env.deploy
            .env
            .env.example
            .DS_Store
            .gitignore
            test_*
            debug_*
            scratch_*
            fix_*
            reset_*
            setup_db*
            check_db*
            migrate_*
            list_tables*
            cleanup*
            db_dump*
            delete_token*
            _autodeploy.php
